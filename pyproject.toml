[project]
name = "favlo"
version = "0.2.0"
description = "Favlo AI Runtime: Your Local AI Workhorse"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Noriel Mallari"}]
requires-python = ">=3.12"
dependencies = [
    "agent-framework-openai>=1",
    "fastmcp[tasks]>=2.14",
    "jinja2>=3.1",
    "numpy>=2.1",
    "pyobjc-framework-coreml>=12.2.2",
    "pyobjc-framework-Metal",
    "safetensors>=0.6",
    "sqlite-vec>=0.1.9",
    "starlette>=0.41",
    "tokenizers>=0.22",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "absl-py>=2",
    "agent-framework-openai>=1",
    "immutabledict>=4",
    "langdetect>=1.0.9",
    "nltk>=3.9",
]
harness = [
    "absl-py>=2",
    "agent-framework-openai>=1",
    "immutabledict>=4",
    "langdetect>=1.0.9",
    "nltk>=3.9",
]

[project.scripts]
favlo = "favlo.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "pipelines/metal41"]
extend-exclude = ["harness/benchmarks/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "pipelines/metal41"]
