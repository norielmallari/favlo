[project]
name = "favlo"
version = "0.5.0"
description = "Favlo AI Runtime: Your Local AI Workhorse"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Noriel Mallari"}]
requires-python = ">=3.12"
dependencies = [
    "agent-framework-openai>=1.18",
    "fastmcp[tasks]>=2.14",
    "jinja2>=3.1",
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "pyobjc-framework-Metal; sys_platform == 'darwin'",
    "safetensors>=0.6",
    "sqlite-vec>=0.1.9",
    "fastapi>=0.115",
    "httpx>=0.27",
    "starlette>=0.41",
    "sse-starlette>=3.4.5",
    "tenacity>=9.1.4,<9.2",
    "tokenizers>=0.22",
    "uvicorn>=0.32",
    "agent-framework-ag-ui>=1.7.1",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "absl-py>=2",
    "agent-framework-openai>=1.18",
    "immutabledict>=4",
    "langdetect>=1.0.9",
    "nltk>=3.9",
]
harness = [
    "absl-py>=2",
    "agent-framework-openai>=1.18",
    "immutabledict>=4",
    "langdetect>=1.0.9",
    "nltk>=3.9",
]
# OpenCV for portable customs (face_swap, relight) loaded via an extra plugin root.
cv = [
    "opencv-python-headless>=4.10",
]

[project.scripts]
favlo = "favlo.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
package = true

# Sync from the checkout root: `uv sync --extra dev`.
# Each pipelines/<id>/<runtime>/pyproject.toml declares that runtime's deps.
# Those packages are not uv workspace members yet (imports stay via
# `pythonpath = pipelines`). A cuda tree is omitted on Darwin until one exists.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "pipelines", "web-api"]
extend-exclude = ["harness/benchmarks/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "pipelines"]
