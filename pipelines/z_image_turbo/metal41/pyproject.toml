[project]
name = "favlo-z-image-turbo-metal41"
version = "0.0.0"
description = "z_image_turbo metal41 runtime for Favlo"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]
